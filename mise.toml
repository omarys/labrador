[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
pre-commit = "4.6.2"

[tasks.update]
description = "Update Go module dependencies"
run = "go get -u ./... && go mod tidy"

[tasks.tidy]
description = "Tidy Go module dependencies"
run = "go mod tidy"

[tasks.test]
description = "Run tests with race detection"
run = "go test -race ./..."

[tasks.build]
description = "Build optimized Labrador binary into bin/"
run = "if [ -d internal/providers/private ]; then go build -tags private -ldflags=\"-s -w\" -o bin/labrador ./cmd/labrador; else go build -ldflags=\"-s -w\" -o bin/labrador ./cmd/labrador; fi"

[tasks.build-public]
description = "Build Labrador binary with public providers only into bin/"
run = "go build -ldflags=\"-s -w\" -o bin/labrador ./cmd/labrador"

[tasks.in]
description = "Build and install Labrador binary into ~/.local/bin and ~/.cargo/bin"
depends = ["build"]
run = "./install.sh"
